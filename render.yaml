services:
  - type: web
    name: ledgerline
    env: node
    plan: free
    buildCommand: npm ci && npm run build && node dist/db/migrate.js
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerline-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AUDIT_HMAC_SECRET
        generateValue: true
      - key: PORT
        value: 3000

databases:
  - name: ledgerline-db
    plan: free
    databaseName: ledgerline
